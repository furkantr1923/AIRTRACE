include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Flutter 3.47+ material.dart'ı material_ui paketine taşıma uyarısı veriyor.
    # Eski/yeni Flutter sürümleriyle uyum için şimdilik material.dart kullanılıyor.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - windows/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_print
    - unawaited_futures
    - always_declare_return_types
